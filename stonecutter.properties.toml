# Mod metadata and dependency versions (Stonecutter structured properties).
# Top-level keys apply everywhere; ["<mc version>"] tables apply only to that version's projects.
# Branch names (common, fabric, neoforge) are lookup tags, so never use one as a key segment (deps.neoforge breaks).

mod.id = "retro64plus"                     # D2
mod.name = "Retro64 Plus"                  # D2
mod.group = "com.nanobuntv.retro64plus"    # D2
mod.version = "1.0.0"
mod.authors = "NanoBunTV"
mod.license = "MIT"                        # D3
mod.slug = "retro64-plus"                  # D2, D109 (free on both sites, 2026-10-07)
mod.sources = "https://github.com/NanoBunTV/Minecraft-Retro64-Plus"  # public source (D131)
mod.description = "Play as our favorite plumber with Super Mario 64's real moveset, caps, coins, stars and enemies. Uses your own SM64 ROM."

deps.mixin = "0.8.7"
deps.mixinextras = "0.5.5"
deps.fabric_loader = "0.19.5"

["1.21.1"]
java = 21
mixins.client = "GuiMixin InventoryScreenMixin LivingEntityMixin MinecraftMixin MouseHandlerMixin PlayerRendererMixin"   # client mixins that exist on this version
mc.pack_meta = '"pack_format": 34'      # pack.mcmeta's format field(s) for this MC version
mc.compat_fabric = ">=1.21.1 <1.21.2"
mc.compat_neoforge = "[1.21.1]"
deps.neoform = "1.21.1-20240808.144430"
deps.parchment_mc = "1.21.1"
deps.parchment = "2024.11.17"
deps.fabric_api = "0.116.17+1.21.1"
deps.neoforge_version = "21.1.255"
deps.neoforge_range = "[21.1.0,)"
# D23: YetAnotherConfigLib, required on both loaders (full Maven coordinates, as Cartridge); yacl_common is the
# Mojang-named build common compiles against. Mod Menu is optional on Fabric.
deps.yacl_common = "dev.isxander:yet-another-config-lib:3.8.1+1.21.1-neoforge"
deps.yacl_fabric = "dev.isxander:yet-another-config-lib:3.8.1+1.21.1-fabric"
deps.yacl_neoforge = "dev.isxander:yet-another-config-lib:3.8.1+1.21.1-neoforge"
deps.yacl_id = "yet_another_config_lib_v3"
deps.yacl_range = "3.8.1"
deps.modmenu = "11.0.5"
# D31: Controlify, compile only (the Mojang-named NeoForge build; common's compat mixin needs its ControllerState).
deps.controlify_common = "dev.isxander:controlify:3.0.1+lts+1.21.1-neoforge"
deps.controlify_fabric = "dev.isxander:controlify:3.0.1+lts+1.21.1-fabric"

